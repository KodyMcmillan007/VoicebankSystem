<link rel="stylesheet" href = "{{url_for('static', filename = 'interfacesearch.css')}}">
<html>
    <head> 
        <title>Interface System</title>
    </head>
    <body>
        <h1>Song Search!</h1>

        <p class="footer">
            <form method="POST">
                <label for="username">Enter Voicebank For Songs:</label>
                <input type="text" ID="username" name="voicebank_id" required>
                <button type="submit">Submit</button>
            </form>
            <p class="table-shower">
                <form action="/show_table" method="post" class="table-form">
                    <input type="submit" value="Show Table?">
                </form>
            </p>
            <div class="voicebank-item-wrapper">
                {% if send_song_data %}
                <p>This voicebank is within these songs, {{send_song_data}}</p>
                 {% endif %}
            </div>
            
        </p>
        <p class="footer">
            <br>
            <br>
            <br>
            <a href="/">Back To Homepage</a>
            <a href="/interface_producersearch.html">Producer Search</a>
            <a href="/interface_producer&voicebank_by_songs.html">Song+Voicebank Search</a>
        </p>
        
        {% if show_table %}
        <table>
            {% for line in final %}
            <tr>
                {% for item in line %}
                    <td>
                {{ item }}        
                    </td>
                {% endfor %}
                    </tr>
                {% endfor %}
            </tr>
        </table>
        {% endif %}
    </body>
    
</html>
